name: Converter PDFs em Texto

on:
  push:
    paths:
      - 'artigos/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install pdfplumber

      - name: Criar pasta de destino
        run: mkdir -p artigos-texto

      - name: Converter PDFs em texto
        run: |
          python << 'EOF'
          import pdfplumber
          from pathlib import Path
          import sys

          pdf_dir = Path('artigos')
          txt_dir = Path('artigos-texto')
          txt_dir.mkdir(exist_ok=True)

          pdfs = sorted(pdf_dir.glob('*.pdf'))
          if not pdfs:
              print("Nenhum PDF encontrado em /artigos/")
              sys.exit(0)

          for pdf_path in pdfs:
              txt_path = txt_dir / pdf_path.with_suffix('.txt').name
              print(f"Processando: {pdf_path.name}")
              try:
                  with pdfplumber.open(pdf_path) as pdf:
                      paginas = []
                      for i, page in enumerate(pdf.pages, 1):
                          texto = page.extract_text()
                          if texto:
                              paginas.append(f"--- PÁGINA {i} ---\n{texto}")
                  conteudo = '\n\n'.join(paginas)
                  txt_path.write_text(conteudo, encoding='utf-8')
                  print(f"  OK: {txt_path.name} ({len(conteudo):,} caracteres, {len(paginas)} páginas)")
              except Exception as e:
                  print(f"  ERRO em {pdf_path.name}: {e}")

          print("\nConversão concluída.")
          EOF

      - name: Verificar arquivos gerados
        run: |
          echo "Arquivos em artigos-texto/:"
          ls -la artigos-texto/ || echo "(pasta vazia)"

      - name: Commit dos arquivos de texto
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add artigos-texto/
          if git diff --staged --quiet; then
            echo "Nenhum arquivo novo para commitar."
          else
            git commit -m "Auto: converter PDFs em texto [skip ci]"
            git push
          fi
